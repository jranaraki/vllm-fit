name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling hatch-vcs

      - name: Set package version from Git tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Setting package version to $TAG"
          
          # Install tomlkit for the current Python
          python -m pip install --upgrade pip
          python -m pip install tomlkit
      
          # Run the inline Python script
          python - <<EOF
          import tomlkit
          pyproject_file = "pyproject.toml"
          with open(pyproject_file, "r") as f:
              doc = tomlkit.parse(f.read())
          doc["project"]["version"] = "${TAG#v}"  # remove leading 'v'
          with open(pyproject_file, "w") as f:
              f.write(tomlkit.dumps(doc))
          EOF

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vllm-fit-${{ github.ref_name }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Merge artifacts
        run: |
          mkdir -p dist/
          find artifacts/ -name "*.whl" -exec cp {} dist/ \;
          find artifacts/ -name "*.tar.gz" -exec cp {} dist/ \;

      - name: Generate Release Notes
        id: release_notes
        run: |
          echo "## Changes in this release" > release_notes.md
          echo "" >> release_notes.md
          if [ -f CHANGELOG.md ]; then
            head -n 20 CHANGELOG.md >> release_notes.md
          else
            echo "See commit history for changes." >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}