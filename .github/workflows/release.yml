name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Prevents multiple release runs from clashing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
        exclude:
          - os: macos-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for VCS-based versioning

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build tomlkit

      - name: Set package version from Git tag
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Setting package version to $TAG"

          # Make sure tomlkit is installed in this Python environment
          python -m pip install --upgrade pip
          python -m pip install tomlkit

          # Inline Python to update version
          python - <<EOF
          import tomlkit
          pyproject_file = "pyproject.toml"
          with open(pyproject_file, "r") as f:
              doc = tomlkit.parse(f.read())
          doc["project"]["version"] = "${TAG#v}"  # remove leading 'v'
          with open(pyproject_file, "w") as f:
              f.write(tomlkit.dumps(doc))
          EOF

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Using a simpler name pattern for easier downloading
          name: vllm-fit-${{ RAW_TAG }}${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the release and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true # This flattens all uploaded files into one folder

      - name: Generate Release Notes
        run: |
          echo "## Changes in ${{ github.ref_name }}" > release_notes.md
          if [ -f CHANGELOG.md ]; then
            head -n 20 CHANGELOG.md >> release_notes.md
          else
            echo "See commit history for changes." >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false